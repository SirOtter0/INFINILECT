name: Temporary comic transition verification
on:
  push:
    branches: [feature/comic-reader-ux]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Focused Desktop tests
        run: ./gradlew :app:desktopTest --tests '*PageReader*Test' --tests '*PageTransitionTest' --tests '*PageSettingsPersistenceTest' --tests '*FilePageReaderSettingsStoreTest' --tests '*PageProgressDurabilityTest' --no-daemon --console=plain --max-workers=2
      - name: Focused Android host tests
        run: ./gradlew :app:testAndroidHostTest --tests '*PageReader*Test' --tests '*PageTransitionTest' --tests '*PageSettingsPersistenceTest' --tests '*FilePageReaderSettingsStoreTest' --tests '*PageProgressDurabilityTest' --no-daemon --console=plain --max-workers=2
      - name: Android and Desktop compilation
        run: ./gradlew :androidApp:compileDebugKotlin :desktopApp:compileKotlin --no-daemon --console=plain --max-workers=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: comic-transition-tests
          path: app/build/test-results/**/*.xml
          retention-days: 7
