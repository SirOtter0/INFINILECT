name: Temporary PR20 updated test APK
on:
  push:
    branches: [feature/bounded-local-pdf]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build unsigned APK
        run: |
          cat > /tmp/pdf20-unsigned.gradle <<'EOF'
          gradle.beforeProject { p ->
            p.pluginManager.withPlugin('com.android.application') {
              p.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
                androidDsl.buildTypes.getByName('debug').signingConfig = null
              }
            }
          }
          EOF
          ./gradlew -I /tmp/pdf20-unsigned.gradle :androidApp:assembleDebug --no-daemon --console=plain --max-workers=2
      - name: Record artifact integrity
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, json, os
          p = pathlib.Path('androidApp/build/outputs/apk/debug/androidApp-debug-unsigned.apk')
          report = {'head': os.environ['GITHUB_SHA'], 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
          pathlib.Path('apk-integrity.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr20-search-fix-unsigned-apk
          retention-days: 7
          if-no-files-found: error
          path: |
            androidApp/build/outputs/apk/debug/androidApp-debug-unsigned.apk
            apk-integrity.json
