name: Bounded PDF verification
on:
  push:
    branches: [feature/bounded-local-pdf]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Required Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Disable signing without creating a replacement key
        run: |
          cat > /tmp/pdf20-unsigned.gradle <<'EOF'
          gradle.beforeProject { p ->
              p.pluginManager.withPlugin('com.android.application') {
                  p.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
                      androidDsl.buildTypes.getByName('debug').signingConfig = null
                  }
              }
          }
          EOF
      - name: Focused contracts and adapters
        run: |
          ./gradlew -I /tmp/pdf20-unsigned.gradle :core:jvmTest --tests '*PdfDocumentTest' --no-daemon --console=plain --max-workers=2
          ./gradlew -I /tmp/pdf20-unsigned.gradle :app:desktopTest --tests '*DesktopPdfEngineTest' --tests '*FilePdfPreparerTest' --no-daemon --console=plain --max-workers=2
      - name: Focused import, reader and progress
        run: ./gradlew -I /tmp/pdf20-unsigned.gradle :app:desktopTest --tests '*DesktopPdfImportTest' --tests '*PdfReaderControllerTest' --tests '*PdfSessionTest' --tests '*FileLocalPublicationSourceTest' --tests '*LocalImportSessionTest' --no-daemon --console=plain --max-workers=2
      - name: Clean verification matrix
        run: |
          ./gradlew -I /tmp/pdf20-unsigned.gradle clean \
            :core:jvmTest :app:desktopTest :core:build :app:build :desktopApp:build \
            :core:testAndroidHostTest :app:testAndroidHostTest \
            :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug \
            :desktopApp:createDistributable \
            --no-daemon --console=plain --max-workers=2 --warning-mode=all
      - name: Record exact test counts and unsigned APK identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as ET
          report = {}
          for root in [Path('core/build/test-results'), Path('app/build/test-results'), Path('androidApp/build/test-results')]:
              for folder in sorted(root.glob('*')):
                  files = list(folder.glob('TEST-*.xml'))
                  if not files:
                      continue
                  counts = {k: 0 for k in ['tests', 'failures', 'errors', 'skipped']}
                  for file in files:
                      tree = ET.parse(file).getroot()
                      for key in counts:
                          counts[key] += int(tree.attrib.get(key, 0))
                  report[str(folder)] = counts
          apks = list(Path('androidApp/build/outputs/apk/debug').glob('*unsigned.apk'))
          assert len(apks) == 1, 'Expected one unsigned APK; never generate a substitute signing identity'
          apk = apks[0]
          report['apk'] = {'path': str(apk), 'bytes': apk.stat().st_size, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'signing': 'unsigned; compatible external keystore unavailable'}
          Path('pdf-verification.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pdf-verification
          path: |
            pdf-verification.json
            core/build/test-results/
            app/build/test-results/
            androidApp/build/test-results/
            androidApp/build/outputs/apk/debug/*unsigned.apk
          retention-days: 7
