name: Bounded PDF verification
on:
  push:
    branches: [feature/bounded-local-pdf]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Required Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Disable signing without creating a replacement key
        run: |
          cat > /tmp/pdf20-unsigned.gradle <<'EOF'
          gradle.beforeProject { p ->
              p.pluginManager.withPlugin('com.android.application') {
                  p.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
                      androidDsl.buildTypes.getByName('debug').signingConfig = null
                  }
              }
          }
          EOF
      # Temporary review evidence only; removed from the branch after focused verification.
      - name: Focused PDF progress and session tests
        run: |
          ./gradlew -I /tmp/pdf20-unsigned.gradle :app:desktopTest --tests '*PdfReaderControllerTest' --tests '*PdfSessionTest' --tests '*ApplicationSessionTest' --tests '*OpenPublicationControllerTest' --tests '*ProgressLifecycleTest' --tests '*DesktopPdfImportTest' --no-daemon --console=plain --max-workers=2
          ./gradlew -I /tmp/pdf20-unsigned.gradle :app:testAndroidHostTest --tests '*PdfReaderControllerTest' --tests '*PdfSessionTest' --tests '*ApplicationSessionTest' --tests '*OpenPublicationControllerTest' --tests '*ProgressLifecycleTest' --no-daemon --console=plain --max-workers=2
      - name: Rebuild updated unsigned test APK after focused tests
        run: ./gradlew -I /tmp/pdf20-unsigned.gradle :androidApp:assembleDebug --no-daemon --console=plain --max-workers=2
      - name: Collect public local signing tool and exact results
        run: |
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" pdf20-apksigner.jar
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,xml.etree.ElementTree as ET
          report={}
          for task in ['desktopTest','testAndroidHostTest']:
              counts={k:0 for k in ['tests','failures','errors','skipped']}
              for file in Path('app/build/test-results',task).glob('TEST-*.xml'):
                  root=ET.parse(file).getroot()
                  for key in counts: counts[key]+=int(root.attrib.get(key,0))
              report[task]=counts
          for name in ['androidApp/build/outputs/apk/debug/androidApp-debug-unsigned.apk','pdf20-apksigner.jar']:
              p=Path(name);report[name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          Path('pdf20-followup-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pdf20-review-evidence
          path: |
            pdf20-followup-verification.json
            app/build/test-results/
            androidApp/build/outputs/apk/debug/*unsigned.apk
            pdf20-apksigner.jar
          retention-days: 7
