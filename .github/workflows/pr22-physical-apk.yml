name: Temporary PR22 physical APK build
on:
  push:
    branches: [build/pr22-physical-acceptance]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 456a80405c19365ab2ebc355ac3b56c9e35e2cd8
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build exact source without generating a signing identity
        run: |
          test "$(git rev-parse HEAD)" = 456a80405c19365ab2ebc355ac3b56c9e35e2cd8
          cat > "$RUNNER_TEMP/unsigned.init.gradle" <<'INIT'
          allprojects {
            afterEvaluate {
              if (plugins.hasPlugin('com.android.application')) {
                android.buildTypes.debug.signingConfig = null
              }
            }
          }
          INIT
          ./gradlew :androidApp:assembleDebug -I "$RUNNER_TEMP/unsigned.init.gradle" --no-daemon --console=plain --max-workers=2
          test -z "$(git status --porcelain)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging androidApp/build/outputs/apk/debug/androidApp-debug-unsigned.apk > "$RUNNER_TEMP/badging.txt"
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess,os
          apk=pathlib.Path('androidApp/build/outputs/apk/debug/androidApp-debug-unsigned.apk')
          badging=pathlib.Path(os.environ['RUNNER_TEMP'],'badging.txt').read_text()
          m=re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",badging)
          assert m and m.group(1)=='org.infinilect.app'
          assert "application-debuggable" in badging and "sdkVersion:'26'" in badging
          report=dict(head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),package=m.group(1),versionCode=m.group(2),versionName=m.group(3),minSdk='26',debuggable=True,bytes=apk.stat().st_size,sha256=hashlib.sha256(apk.read_bytes()).hexdigest())
          apk.with_name('apk-integrity.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PR22-unsigned-debug
          path: |
            androidApp/build/outputs/apk/debug/androidApp-debug-unsigned.apk
            androidApp/build/outputs/apk/debug/apk-integrity.json
          retention-days: 3
